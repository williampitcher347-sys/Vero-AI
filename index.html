<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver-1 Studio</title>
    <style>
        :root {
            --bg-main: #131314;
            --bg-sidebar: #1e1f20;
            --bg-surface: #2d2e30;
            --bg-hover: #333538;
            --text-main: #e3e3e3;
            --text-muted: #8e918f;
            --accent: #a8c7fa;
            --border: #444746;
            --danger: #f2b8b5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Sidebar layout */
        aside {
            width: 280px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0.75rem;
            border-right: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
        }

        .sidebar-top { display: flex; flex-direction: column; gap: 0.25rem; overflow-y: auto; flex: 1; }

        .new-chat-btn {
            background: var(--bg-surface);
            color: var(--text-main);
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
            transition: background 0.2s;
            width: fit-content;
        }
        .new-chat-btn:hover { background: var(--bg-hover); }

        .section-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            padding: 0.5rem 0.75rem;
            letter-spacing: 0.05em;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow-y: auto;
        }

        .history-item {
            background: transparent;
            color: var(--text-main);
            border: none;
            padding: 0.6rem 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.15s;
        }
        .history-item:hover { background: var(--bg-surface); }

        /* Sidebar Bottom Profile & Settings */
        .sidebar-bottom {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            border-top: 1px solid var(--border);
            padding-top: 0.75rem;
            flex-shrink: 0;
        }

        .user-profile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        .user-info { display: flex; align-items: center; gap: 0.6rem; }
        .avatar-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #5b37b7;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .settings-trigger-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
            border-radius: 4px;
        }
        .settings-trigger-btn:hover { color: var(--text-main); background: var(--bg-surface); }

        /* Settings Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 440px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 1rem; font-weight: 600; }
        .close-modal-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
        .close-modal-btn:hover { color: var(--text-main); }
        
        .setting-group { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.8rem; }
        .setting-group label { color: var(--text-muted); font-weight: 500; }
        .setting-group input[type="text"], .setting-group input[type="color"], .setting-group select {
            background: var(--bg-main);
            border: 1px solid var(--border);
            padding: 0.5rem;
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            width: 100%;
        }
        .setting-group input[type="file"] { font-size: 0.8rem; color: var(--text-muted); }

        .action-btn {
            background: rgba(168, 199, 250, 0.15);
            color: var(--accent);
            border: 1px solid rgba(168, 199, 250, 0.3);
            width: 100%;
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.2rem;
        }
        .action-btn:hover { background: rgba(168, 199, 250, 0.25); }

        .clear-cache-btn {
            background: rgba(242, 184, 181, 0.15);
            color: var(--danger);
            border: 1px solid rgba(242, 184, 181, 0.3);
            width: 100%;
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.2rem;
        }
        .clear-cache-btn:hover { background: rgba(242, 184, 181, 0.25); }

        /* Main Workspace Split Container */
        .workspace-container {
            flex: 1;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: rgba(19, 19, 20, 0.85);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            min-width: 0;
            transition: all 0.3s ease;
        }

        header {
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        .message-wrapper {
            width: 100%;
            max-width: 850px;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .msg-avatar.ai { background: linear-gradient(135deg, #1a73e8, #8ab4f8); color: white; }
        .msg-avatar.user { background: #5f6368; color: white; }

        .msg-content {
            line-height: 1.6;
            font-size: 0.95rem;
            flex: 1;
            word-wrap: break-word;
            padding-top: 0.3rem;
        }

        .file-attachment-badge {
            display: inline-block;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--accent);
            margin-bottom: 0.4rem;
        }

        /* Codex-Style Rounded Side Panel Viewer */
        #codex-side-panel {
            width: 0px;
            background: var(--bg-sidebar);
            border-left: 1px solid var(--border);
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
            display: flex;
            flex-direction: column;
            transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            flex-shrink: 0;
            z-index: 20;
            margin: 0.5rem 0.5rem 0.5rem 0;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        #codex-side-panel.open {
            width: 520px;
        }
        .side-panel-header {
            background: #252628;
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            font-weight: 500;
        }
        .side-panel-url { font-family: monospace; color: var(--accent); font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 330px; }
        .side-panel-close { background: transparent; border: none; color: var(--danger); cursor: pointer; font-size: 1.1rem; font-weight: bold; }
        .side-panel-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            flex: 1;
        }

        /* Bottom Input Bar */
        .input-area {
            padding: 1rem 2rem 2rem 2rem;
            display: flex;
            justify-content: center;
        }

        .input-box-wrapper {
            width: 100%;
            max-width: 850px;
            background: var(--bg-surface);
            border-radius: 24px;
            padding: 0.75rem 1rem 0.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            border: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .input-box-wrapper:focus-within { border-color: var(--border); }

        textarea {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.95rem;
            resize: none;
            outline: none;
            font-family: inherit;
            min-height: 24px;
            max-height: 120px;
            width: 100%;
        }

        .input-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 0.4rem;
        }

        .toolbar-left { display: flex; align-items: center; gap: 1rem; }
        .toolbar-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 0.3rem; }
        .toolbar-btn:hover { color: var(--text-main); }

        .send-btn {
            background: var(--accent);
            color: #001d35;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: transform 0.1s;
            flex-shrink: 0;
        }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

        .status-pill {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: #f59e0b; }
        .dot.ready { background: #34a853; }
        .dot.unloaded { background: var(--text-muted); }
    </style>
</head>
<body>

    <!-- Sidebar Layout -->
    <aside>
        <div class="sidebar-top">
            <button class="new-chat-btn" id="new-chat-btn">➕ New chat</button>
            <div class="section-title">Recent Chats</div>
            <div class="history-list" id="history-list"></div>
        </div>

        <div class="sidebar-bottom">
            <div class="user-profile">
                <div class="user-info">
                    <div class="avatar-circle" id="user-initial">W</div>
                    <span id="profile-name-display">William</span>
                </div>
                <button class="settings-trigger-btn" id="open-settings-btn" title="Settings">⚙️</button>
            </div>
            <div style="padding: 0 0.5rem 0.2rem 0.5rem; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 0.75rem; color: var(--text-muted);" id="engine-label">Ver-1 Engine</span>
                <span class="status-pill"><span class="dot" id="status-dot"></span><span id="status-text">Unloaded</span></span>
            </div>
        </div>
    </aside>

    <!-- Settings Modal Menu -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Studio Settings</span>
                <button class="close-modal-btn" id="close-settings-btn">&times;</button>
            </div>

            <div class="setting-group">
                <label>Your Name:</label>
                <input type="text" id="setting-username" value="William">
            </div>

            <div class="setting-group">
                <label>AI Assistant Name:</label>
                <input type="text" id="setting-ainame" value="Vero" disabled style="opacity: 0.6; cursor: not-allowed;">
            </div>

            <div class="setting-group">
                <label>Select AI Model:</label>
                <select id="setting-model">
                    <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B (Fast & Lightweight)</option>
                    <option value="Llama-3.2-3B-Instruct-q4f16_1-MLC">Llama 3.2 3B (Balanced)</option>
                    <option value="Llama-3-8B-Instruct-q4f16_1-MLC">🔥 Llama 3 8B Instruct (Ultra Strong)</option>
                    <option value="Phi-3.5-mini-instruct-q4f16_1-MLC">Phi-3.5 Mini (Smart & Capable)</option>
                    <option value="Mistral-7B-Instruct-v0.3-q4f16_1-MLC">⚡ Mistral 7B v0.3 (Powerful)</option>
                </select>
            </div>

            <button class="action-btn" id="load-model-btn">🚀 Load / Switch Model</button>
            <button class="action-btn" id="unload-model-btn" style="background: rgba(245, 158, 11, 0.15); color: #f59e0b; border-color: rgba(245, 158, 11, 0.3);">🧹 Unload Model (Free Memory)</button>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 0.2rem 0;">

            <div class="setting-group">
                <label>Background Image URL:</label>
                <input type="text" id="setting-bg" placeholder="https://example.com/image.jpg">
            </div>

            <div class="setting-group">
                <label>Or Upload Background Image File:</label>
                <input type="file" id="setting-bg-file" accept="image/*">
            </div>

            <div class="setting-group">
                <label>Accent Color Override:</label>
                <input type="color" id="setting-accent" value="#a8c7fa">
            </div>

            <div style="font-size: 0.7rem; color: var(--text-muted);" id="storage-info">Checking cache...</div>
            <button class="clear-cache-btn" id="clear-cache-btn">🗑️️ Clear Model Weight Cache</button>
        </div>
    </div>

    <!-- Main Workspace Split Container -->
    <div class="workspace-container" id="workspace-container">
        <main id="main-backdrop">
            <header>
                <span id="header-title">Ver-1 Studio (TTS & Codex Viewer)</span>
            </header>

            <div id="chat-container">
                <div class="message-wrapper">
                    <div class="msg-avatar ai">V</div>
                    <div class="msg-content">Hello William! I am Vero. Load a model in settings, type your message, and ask me to open any website in the Codex panel!</div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-box-wrapper">
                    <textarea id="user-input" rows="1" placeholder="Load a model in settings to start..." disabled></textarea>
                    <div class="input-toolbar">
                        <div class="toolbar-left">
                            <button class="toolbar-btn" id="save-chat-btn">💾 Save Chat</button>
                            <label class="toolbar-btn" for="file-upload-input" style="cursor:pointer;">📎 Attach</label>
                            <input type="file" id="file-upload-input" style="display:none;" accept=".txt,.html,.js,.css,.json,.md,.py">
                        </div>
                        <button class="send-btn" id="send-btn" disabled>↑</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Codex-Style Rounded Side Panel -->
        <aside id="codex-side-panel">
            <div class="side-panel-header">
                <div>🌐 Codex Panel: <span class="side-panel-url" id="panel-url-text">about:blank</span></div>
                <button class="side-panel-close" id="close-side-panel" title="Close Panel">✕</button>
            </div>
            <iframe class="side-panel-iframe" id="side-panel-iframe" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
        </aside>
    </div>

    <script type="module">
        import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

        let engine = null;
        let attachedFileContent = null;
        let attachedFileName = null;

        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const inputField = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatContainer = document.getElementById('chat-container');
        const historyList = document.getElementById('history-list');
        const storageInfo = document.getElementById('storage-info');
        const clearCacheBtn = document.getElementById('clear-cache-btn');
        const saveChatBtn = document.getElementById('save-chat-btn');
        const newChatBtn = document.getElementById('new-chat-btn');
        const fileUploadInput = document.getElementById('file-upload-input');
        const loadModelBtn = document.getElementById('load-model-btn');
        const unloadModelBtn = document.getElementById('unload-model-btn');

        // Codex Side Panel elements
        const codexSidePanel = document.getElementById('codex-side-panel');
        const sidePanelIframe = document.getElementById('side-panel-iframe');
        const panelUrlText = document.getElementById('panel-url-text');
        const closeSidePanelBtn = document.getElementById('close-side-panel');

        closeSidePanelBtn.onclick = () => {
            codexSidePanel.classList.remove('open');
            sidePanelIframe.src = 'about:blank';
        };

        // Modal elements
        const settingsModal = document.getElementById('settings-modal');
        const openSettingsBtn = document.getElementById('open-settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const settingUsername = document.getElementById('setting-username');
        const profileNameDisplay = document.getElementById('profile-name-display');
        const userInitial = document.getElementById('user-initial');
        const settingModel = document.getElementById('setting-model');
        const settingBg = document.getElementById('setting-bg');
        const settingBgFile = document.getElementById('setting-bg-file');
        const settingAccent = document.getElementById('setting-accent');
        const mainBackdrop = document.getElementById('main-backdrop');

        openSettingsBtn.onclick = () => settingsModal.classList.add('active');
        closeSettingsBtn.onclick = () => settingsModal.classList.remove('active');

        // Personalization & Settings Persistence
        settingUsername.addEventListener('input', () => {
            const name = settingUsername.value.trim() || 'William';
            profileNameDisplay.textContent = name;
            userInitial.textContent = name.charAt(0).toUpperCase();
            localStorage.setItem('ver1_username', name);
        });

        settingAccent.addEventListener('input', () => {
            document.documentElement.style.setProperty('--accent', settingAccent.value);
            localStorage.setItem('ver1_accent', settingAccent.value);
        });

        settingBg.addEventListener('input', () => {
            mainBackdrop.style.backgroundImage = `url('${settingBg.value}')`;
            localStorage.setItem('ver1_bg', settingBg.value);
        });

        settingBgFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    mainBackdrop.style.backgroundImage = `url('${event.target.result}')`;
                    localStorage.setItem('ver1_bg', event.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        // Load saved settings on startup
        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('ver1_username');
            if (savedName) {
                settingUsername.value = savedName;
                profileNameDisplay.textContent = savedName;
                userInitial.textContent = savedName.charAt(0).toUpperCase();
            }
            const savedAccent = localStorage.getItem('ver1_accent');
            if (savedAccent) {
                settingAccent.value = savedAccent;
                document.documentElement.style.setProperty('--accent', savedAccent);
            }
            const savedBg = localStorage.getItem('ver1_bg');
            if (savedBg) {
                mainBackdrop.style.backgroundImage = `url('${savedBg}')`;
                settingBg.value = savedBg.startsWith('data:') ? '' : savedBg;
            }
            checkCacheSize();
            loadChatHistoryList();
        });

        async function checkCacheStorage() {
            if ('storage' in navigator && 'estimate' in navigator.storage) {
                const estimate = await navigator.storage.estimate();
                const usedMB = (estimate.usage / (1024 * 1024)).toFixed(1);
                const totalMB = (estimate.quota / (1024 * 1024)).toFixed(0);
                storageInfo.textContent = `Cache Used: ${usedMB} MB / ${totalMB} MB`;
            } else {
                storageInfo.textContent = 'Cache estimation not supported.';
            }
        }
        function checkCacheSize() { checkCacheStorage(); }

        clearCacheBtn.onclick = async () => {
            if (confirm('Are you sure you want to clear cached model weights? They will need to be re-downloaded next time.')) {
                if ('caches' in window) {
                    const keys = await caches.keys();
                    for (const key of keys) { await caches.delete(key); }
                }
                alert('Model weight cache cleared successfully.');
                checkCacheStorage();
            }
        };

        // Text-to-Speech function
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/```[\s\S]*?```/g, 'code block').replace(/[*#_`]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Auto-resize textarea
        inputField.addEventListener('input', () => {
            inputField.style.height = 'auto';
            inputField.style.height = inputField.scrollHeight + 'px';
        });

        // File Attachment handler
        fileUploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                attachedFileContent = event.target.result;
                attachedFileName = file.name;
                addMessageToChat('system', `Attached file: ${file.name}`);
            };
            reader.readAsText(file);
        });

        // Web-LLM Model Initialization
        loadModelBtn.onclick = async () => {
            const modelId = settingModel.value;
            statusText.textContent = 'Loading...';
            statusDot.className = 'dot';
            loadModelBtn.disabled = true;
            unloadModelBtn.disabled = true;

            try {
                engine = await CreateMLCEngine(modelId, {
                    initProgressCallback: (progress) => {
                        statusText.textContent = `${progress.text} (${Math.round(progress.progress * 100)}%)`;
                    }
                });
                statusText.textContent = 'Ready';
                statusDot.className = 'dot ready';
                inputField.disabled = false;
                sendBtn.disabled = false;
                inputField.placeholder = 'Message Vero...';
                loadModelBtn.disabled = false;
                unloadModelBtn.disabled = false;
                settingsModal.classList.remove('active');
            } catch (err) {
                console.error(err);
                statusText.textContent = 'Load Failed';
                statusDot.className = 'dot unloaded';
                loadModelBtn.disabled = false;
                unloadModelBtn.disabled = false;
                alert('Failed to load model: ' + err.message);
            }
        };

        unloadModelBtn.onclick = async () => {
            if (engine) {
                await engine.unload();
                engine = null;
                statusText.textContent = 'Unloaded';
                statusDot.className = 'dot unloaded';
                inputField.disabled = true;
                sendBtn.disabled = true;
                inputField.placeholder = 'Load a model in settings to start...';
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                alert('Model unloaded and memory freed.');
            }
        };

        // Codex Side Panel URL Extractor Tool
        function checkForCodexCommands(text) {
            const urlRegex = /(?:https?:\/\/|www\.)[^\s]+|[a-zA-Z0-9][-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b(?:[-a-zA-Z0-9()@:%_\+.~#?&//=]*)/gi;
            const matches = text.match(urlRegex);
            if (matches && (text.toLowerCase().includes('open') || text.toLowerCase().includes('show') || text.toLowerCase().includes('browse') || text.toLowerCase().includes('codex') || text.toLowerCase().includes('visit'))) {
                let targetUrl = matches[0];
                if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                    targetUrl = 'https://' + targetUrl;
                }
                panelUrlText.textContent = targetUrl;
                sidePanelIframe.src = targetUrl;
                codexSidePanel.classList.add('open');
            }
        }

        // Chat History State
        let currentChatMessages = [];
        let chatHistoryLog = JSON.parse(localStorage.getItem('ver1_history') || '[]');

        function saveCurrentChat() {
            if (currentChatMessages.length === 0) return;
            const chatTitle = currentChatMessages[0].content.substring(0, 30) + '...';
            chatHistoryLog.unshift({ title: chatTitle, messages: [...currentChatMessages] });
            if (chatHistoryLog.length > 20) chatHistoryLog.pop();
            localStorage.setItem('ver1_history', JSON.stringify(chatHistoryLog));
            loadChatHistoryList();
        }

        function loadChatHistoryList() {
            historyList.innerHTML = '';
            chatHistoryLog.forEach((chat, idx) => {
                const btn = document.createElement('button');
                btn.className = 'history-item';
                btn.textContent = chat.title;
                btn.onclick = () => restoreChat(idx);
                historyList.appendChild(btn);
            });
        }

        function restoreChat(idx) {
            saveCurrentChat();
            const chat = chatHistoryLog[idx];
            currentChatMessages = [...chat.messages];
            chatContainer.innerHTML = '';
            currentChatMessages.forEach(msg => {
                appendMessageDOM(msg.role === 'user' ? 'William' : 'Vero', msg.content, msg.role === 'user' ? 'user' : 'ai');
            });
        }

        newChatBtn.onclick = () => {
            saveCurrentChat();
            currentChatMessages = [];
            chatContainer.innerHTML = `
                <div class="message-wrapper">
                    <div class="msg-avatar ai">V</div>
                    <div class="msg-content">New chat started! How can I help you today, William?</div>
                </div>
            `;
        };

        saveChatBtn.onclick = () => {
            saveCurrentChat();
            alert('Chat saved to recent history!');
        };

        function addMessageToChat(sender, text) {
            const role = (sender === 'William' || sender === 'system') ? 'user' : 'assistant';
            currentChatMessages.push({ role: role, content: text });
            appendMessageDOM(sender, text, role === 'user' ? 'user' : 'ai');
        }

        function appendMessageDOM(sender, text, type) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';

            const avatar = document.createElement('div');
            avatar.className = `msg-avatar ${type}`;
            avatar.textContent = type === 'ai' ? 'V' : (settingUsername.value.charAt(0).toUpperCase() || 'W');

            const content = document.createElement('div');
            content.className = 'msg-content';
            
            if (attachedFileName && type === 'user' && text.includes(attachedFileName)) {
                const badge = document.createElement('div');
                badge.className = 'file-attachment-badge';
                badge.textContent = `📎 ${attachedFileName}`;
                content.appendChild(badge);
            }

            const textNode = document.createElement('div');
            textNode.textContent = text;
            content.appendChild(textNode);

            wrapper.appendChild(avatar);
            wrapper.appendChild(content);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Sending Message Logic
        async function handleSendMessage() {
            const text = inputField.value.trim();
            if ((!text && !attachedFileContent) || !engine) return;

            let fullPrompt = text;
            if (attachedFileContent) {
                fullPrompt += `\n\n[Attached File Content (${attachedFileName})]:\n${attachedFileContent}`;
                attachedFileContent = null;
                attachedFileName = null;
            }

            const username = settingUsername.value.trim() || 'William';
            addMessageToChat(username, text);
            inputField.value = '';
            inputField.style.height = 'auto';

            // Check if user requested to open a website in Codex
            checkForCodexCommands(text);

            const aiWrapper = document.createElement('div');
            aiWrapper.className = 'message-wrapper';
            aiWrapper.innerHTML = `
                <div class="msg-avatar ai">V</div>
                <div class="msg-content">...</div>
            `;
            chatContainer.appendChild(aiWrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            const aiTextNode = aiWrapper.querySelector('.msg-content');

            const systemPrompt = `You are Vero, an advanced AI assistant created by William (your owner and creator). You operate inside Ver-1 Studio. Your creator is William, who was born on April 10, 2013, and lives in South Wales, United Kingdom. You are intelligent, helpful, technical, and precise.`;

            const messages = [
                { role: "system", content: systemPrompt },
                ...currentChatMessages.map(m => ({ role: m.role, content: m.content }))
            ];

            try {
                const reply = await engine.chat.completions.create({
                    messages: messages,
                    temperature: 0.7,
                });

                const replyText = reply.choices[0].message.content;
                aiTextNode.textContent = replyText;
                currentChatMessages.push({ role: "assistant", content: replyText });
                chatContainer.scrollTop = chatContainer.scrollHeight;

                // Automatically speak out the response
                speakText(replyText);

            } catch (err) {
                console.error(err);
                aiTextNode.textContent = 'Error generating response: ' + err.message;
            }
        }

        sendBtn.onclick = handleSendMessage;
        inputField.onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSendMessage();
            }
        };
    </script>
</body>
</html>
